<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="صفحه ورود مینیمال و مدرن" />
  <title>ورود به حساب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="brand-panel" aria-label="معرفی محصول">
      <div class="brand-mark" aria-hidden="true">ن</div>
      <div class="brand-copy">
        <span class="eyebrow">خوش آمدید</span>
        <h1>فضای کاری خود را<br /><span>دوباره کشف کنید.</span></h1>
        <p>همه‌چیز برای شروع یک روز پربازده، همین‌جاست.</p>
      </div>
      <div class="floating-shape shape-one"></div>
      <div class="floating-shape shape-two"></div>
    </section>

    <section class="form-panel" aria-labelledby="login-title">
      <div class="form-container">
        <div class="mobile-brand" aria-hidden="true">ن</div>
        <div class="form-heading">
          <span class="eyebrow">حساب کاربری</span>
          <h2 id="login-title">ورود به حساب</h2>
          <p>برای ادامه، اطلاعات خود را وارد کنید.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="email">ایمیل</label>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="m3 7 9 6 9-6"/></svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
            <span class="error-message" id="email-error"></span>
          </div>

          <div class="field-group">
            <div class="label-row">
              <label for="password">رمز عبور</label>
              <a href="#forgot" class="text-link">رمز عبور را فراموش کرده‌اید؟</a>
            </div>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="10" width="18" height="11" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="رمز عبور خود را وارد کنید" required minlength="6" />
              <button type="button" class="password-toggle" id="password-toggle" aria-label="نمایش رمز عبور">نمایش</button>
            </div>
            <span class="error-message" id="password-error"></span>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" name="remember" />
            <span class="custom-checkbox"></span>
            <span>مرا به خاطر بسپار</span>
          </label>

          <button class="submit-button" type="submit">
            <span>ورود به حساب</span>
            <span class="button-arrow" aria-hidden="true">←</span>
          </button>
          <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
        </form>

        <div class="divider"><span>یا</span></div>
        <button class="social-button" type="button" aria-label="ورود با گوگل">
          <span class="google-icon">G</span>
          ورود با حساب گوگل
        </button>
        <p class="signup-copy">حساب کاربری ندارید؟ <a href="#signup" class="text-link">ثبت‌نام کنید</a></p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
