<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به حساب کاربری</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand" aria-hidden="true">◆</div>
      <h1 id="login-title">خوش آمدید</h1>
      <p class="subtitle">برای ورود به حساب کاربری خود اطلاعات زیر را وارد کنید.</p>

      <form class="login-form" action="#" method="post">
        <div class="form-group">
          <label for="email">ایمیل</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">رمز عبور</label>
            <a href="#forgot-password">فراموشی رمز عبور؟</a>
          </div>
          <input type="password" id="password" name="password" placeholder="رمز عبور خود را وارد کنید" autocomplete="current-password" required>
        </div>

        <label class="remember-me">
          <input type="checkbox" name="remember">
          <span>مرا به خاطر بسپار</span>
        </label>

        <button type="submit">ورود به حساب</button>
      </form>

      <p class="signup-text">حساب کاربری ندارید؟ <a href="#signup">ثبت‌نام کنید</a></p>
    </section>
  </main>
</body>
</html>
